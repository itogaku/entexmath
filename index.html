<style>

<div class="wrap">
  <div class="top"><h1>入試数学 大問ジェネレーター<small>分野を選ぶと，入試形式の大問を何度でも作ります</small></h1><span class="stamp" id="stamp"></span></div>

  <p class="foot no-print">数値・図形・問われ方は毎回ランダムに変わります。答えを表示すると，各問の下と最後の「解答・解説」に答えが出ます。</p>

<script>
// ===== core: 乱数・分数・根号・式の整形・SVG =====
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, k) => shuffle(a).slice(0, k);
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const lcm = (a, b) => a / gcd(a, b) * b;
const RNZ = (a, b) => { let v; do v = R(a, b); while (v === 0); return v; };
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
const isPrime = n => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
const isSq = n => n >= 0 && Math.round(Math.sqrt(n)) ** 2 === n;
function retry(fn, tries = 400) { for (let i = 0; i < tries; i++) { const r = fn(); if (r) return r; } throw new Error('生成に失敗しました'); }

const KANA = ['ア', 'イ', 'ウ', 'エ', 'オ', 'カ', 'キ', 'ク'];
const MARU = ['①', '②', '③', '④', '⑤', '⑥'];
const MINUS = '−';

// 分数クラス
class Q {
  constructor(n, d = 1) {
    if (d === 0) throw new Error('zero div');
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d) || 1; this.n = n / g; this.d = d / g;
  }
  static of(x) { return x instanceof Q ? x : new Q(x, 1); }
  add(o) { o = Q.of(o); return new Q(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { o = Q.of(o); return new Q(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { o = Q.of(o); return new Q(this.n * o.n, this.d * o.d); }
  div(o) { o = Q.of(o); return new Q(this.n * o.d, this.d * o.n); }
  neg() { return new Q(-this.n, this.d); }
  abs() { return new Q(Math.abs(this.n), this.d); }
  get v() { return this.n / this.d; }
  isInt() { return this.d === 1; }
  eq(o) { o = Q.of(o); return this.n === o.n && this.d === o.d; }
  sign() { return Math.sign(this.n); }
  html() { return qh(this); }
}
const q = (n, d = 1) => new Q(n, d);

// 表示
const num = n => (n < 0 ? MINUS + Math.abs(n) : '' + n);
const pnum = n => (n < 0 ? '(' + MINUS + Math.abs(n) + ')' : '' + n); // 負なら括弧
const frac = (a, b) => `<span class="fr"><span class="nu">${a}</span><span class="de">${b}</span></span>`;
function qh(x) { x = Q.of(x); if (x.d === 1) return num(x.n); return (x.n < 0 ? MINUS : '') + frac(Math.abs(x.n), x.d); }
const qp = x => { x = Q.of(x); return x.sign() < 0 ? '(' + qh(x) + ')' : qh(x); };
const V = s => `<i>${s}</i>`;
const sup = (b, e) => (e === 1 ? b : `${b}<sup>${e}</sup>`);
function mono(m) { return Object.keys(m).filter(k => m[k]).map(k => sup(V(k), m[k])).join(''); }
const rt = x => `<span class="rt">√<span class="rc">${x}</span></span>`;
function sqrtSimp(n) { let a = 1, b = n; for (let i = 2; i * i <= b; i++) while (b % (i * i) === 0) { b /= i * i; a *= i; } return [a, b]; }
// a√b (a: Q or int)
function rootH(a, b) { a = Q.of(a); if (b === 1) return qh(a); if (a.eq(1)) return rt(b); if (a.eq(-1)) return MINUS + rt(b); if (a.isInt()) return num(a.n) + rt(b); return (a.n < 0 ? MINUS : '') + frac((Math.abs(a.n) === 1 ? '' : Math.abs(a.n)) + rt(b), a.d); }
// √n を簡約表示
const sqrtH = n => { const [a, b] = sqrtSimp(n); return rootH(a, b); };
const sqrtHq = x => { x = Q.of(x); const [a1, b1] = sqrtSimp(x.n * x.d); return rootH(q(a1, x.d), b1); }; // √(n/d)

// 多項式  terms: [[coef(Q|int), varHtml]]  varHtml '' は定数
function poly(terms, opt = {}) {
  let s = '';
  terms = terms.map(([c, v]) => [Q.of(c), v]).filter(([c]) => c.n !== 0);
  if (!terms.length) return '0';
  terms.forEach(([c, v], i) => {
    const neg = c.n < 0; const a = c.abs();
    let body;
    if (v === '') body = qh(a);
    else if (a.eq(1)) body = v;
    else if (a.isInt()) body = a.n + v;
    else body = opt.fracWhole ? frac(a.n === 1 ? v : a.n + v, a.d) : frac(a.n, a.d) + v;
    if (i === 0) s += (neg ? MINUS : '') + body;
    else s += (neg ? ' ' + MINUS + ' ' : ' + ') + body;
  });
  return s;
}
const X = V('x'), Y = V('y'), A_ = V('a'), B_ = V('b'), N_ = V('n');
const X2 = sup(V('x'), 2);
// y = mx + b
const lineEq = (m, b, xv = X) => `${Y} = ${poly([[m, xv], [b, '']])}`;
const pt = (x, y) => `(${qh(x)}, ${qh(y)})`;
const ptN = (name, x, y) => `${name}${pt(x, y)}`;
function fmtDec(x, d = 2) { const r = Math.round(x * 10 ** d) / 10 ** d; let s = r.toFixed(d); if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, ''); return s.replace('-', MINUS); }
const fixDec = (x, d = 2) => (Math.round(x * 10 ** d) / 10 ** d).toFixed(d);

// 選択肢
function choices(list, cols) {
  cols = cols || (list.every(t => String(t).replace(/<[^>]+>/g, '').length < 14) ? Math.min(list.length, 4) : 1);
  return `<div class="choices" style="--cols:${cols}">` + list.map((t, i) => `<div class="ch"><b>${KANA[i]}</b>　${t}</div>`).join('') + '</div>';
}
const box = s => `<span class="bx">${s}</span>`;           // 解答欄の枠
const blank = (s = '') => `<span class="blank">${s}</span>`;
const panel = (title, body) => `<div class="panel">${title ? `<div class="ptitle">${title}</div>` : ''}${body}</div>`;
const table = (rows, cls = '') => `<table class="tb ${cls}">` + rows.map((r, i) => '<tr>' + r.map(c => (i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`)).join('') + '</tr>').join('') + '</table>';
function tableH(head, rows, cls = '') { return `<table class="tb ${cls}"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map((c, j) => (j === 0 ? `<th class="rh">${c}</th>` : `<td>${c}</td>`)).join('')}</tr>`).join('')}</table>`; }

// 確率: 列挙
function prob(space, pred) { let c = 0; space.forEach(e => { if (pred(e)) c++; }); return q(c, space.length); }
const dice2 = () => { const s = []; for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) s.push([a, b]); return s; };
const pairs = arr => { const s = []; for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) s.push([arr[i], arr[j]]); return s; };
const ordered = arr => { const s = []; for (let i = 0; i < arr.length; i++) for (let j = 0; j < arr.length; j++) if (i !== j) s.push([arr[i], arr[j]]); return s; };
const withRep = arr => { const s = []; for (const a of arr) for (const b of arr) s.push([a, b]); return s; };

// 統計: 中学の四分位数（前半・後半の中央値）
const median = s => { const n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
function five(data) { const s = data.slice().sort((a, b) => a - b); const n = s.length; return [s[0], median(s.slice(0, Math.floor(n / 2))), median(s), median(s.slice(Math.ceil(n / 2))), s[n - 1]]; }

// ===== SVG =====
class Svg {
  constructor(w, h, cls = '') { this.w = w; this.h = h; this.cls = cls; this.el = []; }

  if (t === 1) { // 2けたの数の入れかえ差
    const a = R(2, 9), b = R(1, a - 1); const n = 10 * a + b, m = 10 * b + a; const d = n - m; const k = R(1, 8);
    const ans = range(10, 99).filter(v => { const x = Math.floor(v / 10), y = v % 10; return y > 0 && x - y === k; });
    return { title: '会話文（2けたの数）', lead: `次は，${names[0]}さんと${names[1]}さんの会話である。<br>` + dialog([
      [names[0], `2けたの自然数から，その数の十の位の数と一の位の数を入れかえた数をひくと，どうなるかな。`],
      [names[1], `${n} なら，${n} − ${m} = ${bx('あ')} だね。`],
      [names[0], `十の位の数を ${A_}，一の位の数を ${B_} とすると，もとの数は ${bx('い')}，入れかえた数は 10${B_} + ${A_} と表せるよ。`],
      [names[1], `差を計算すると ${bx('う')}(${A_} − ${B_}) になるから，差はいつも ${bx('う')} の倍数だね。`],
    ]) + 'このとき，次の問いに答えなさい。', items: [
      { q: `${bx('あ')} にあてはまる数を答えなさい。`, a: `${d}` },
      { q: `${bx('い')} にあてはまる式と，${bx('う')} にあてはまる数を答えなさい。`, a: `い：10${A_} + ${B_}，う：9` },
      { q: `もとの数から入れかえた数をひいた差が ${9 * k} になる2けたの自然数は，全部で何個あるか求めなさい。`, a: `${ans.length} 個（${ans.join('，')}）`, ex: `${A_} − ${B_} = ${k}` },
    ] };
  }
  // 連続する2つの偶数の積+1 = 奇数の2乗
  const e = R(2, 20) * 2; const val = e * (e + 2) + 1; const nn = R(10, 40);
  return { title: '会話文（連続する偶数）', lead: `次は，先生と${names[0]}さんの会話である。<br>` + dialog([
    ['先生', '連続する2つの偶数の積に1を加えると，どんな数になるだろう。'],

SO.dankai = () => {
  const T0 = pick([30, 60]), p0 = pick([200, 300, 400]), u = pick([15, 20, 30]), p = pick([100, 150]); const fee = x => (x <= T0 ? p0 : p0 + Math.ceil((x - T0) / u) * p);
  const Bu = 60, Bp = pick([300, 400, 500]); const feeB = x => Math.ceil(x / Bu) * Bp;
  const x1 = T0 + u * R(1, 4) + R(1, u - 1); const target = p0 + p * R(2, 5); const k = (target - p0) / p; const lo = T0 + u * (k - 1), hi = T0 + u * k;
  const xmax = T0 + u * 5; const x2 = R(2, 5) * 30 + R(1, 29);

  edges.forEach(e => pl.lab([e, 0], e, 0, 11, { size: 9 })); [p0, fee(xmax)].forEach(v => pl.lab([0, v], v, -16, 0, { size: 9 }));

    { q: `料金が ${target} 円になるのは，駐車時間が何分より長く何分以下のときか答えなさい。`, a: `${lo} 分より長く ${hi} 分以下` },

  ];
  return { title: '関数の利用（段階的に変わる料金）', lead: `A駐車場の料金は，駐車時間が ${T0} 分以内なら ${p0} 円，${T0} 分をこえると ${u} 分ごとに ${p} 円ずつ加算される。駐車時間を ${X} 分，料金を ${Y} 円とするとき，下のグラフは ${X} と ${Y} の関係の一部を表したものである（●はその点をふくみ，○はふくまないことを表す）。<br>このとき，次の問いに答えなさい。`, fig: pl.toString(), items };
};
Object.assign(SO_LABEL, { kaiwa: '会話文形式（文字式の説明）', dankai: '段階的に変わる料金（駐車場）' });
SO.teika = () => {
  const x = R(8, 30) * 50, y = R(6, 30) * 50; const na = R(1, 3), nb = R(1, 3); const ra = pick([10, 20, 30]), rb = pick([10, 20, 25, 30, 40]); if (ra === rb) return null;
  const S = na * x + nb * y; const T = na * x * (100 - ra) / 100 + nb * y * (100 - rb) / 100; if (!Number.isInteger(T)) return null;
  const it = pick([['シャツ', 'ズボン'], ['ケーキ', 'プリン'], ['ノート', 'ペンケース']]);

    { q: `${X}，${Y} についての連立方程式をつくりなさい。`, a: `<span class="sys"><span>${poly([[na, X], [nb, Y]])} = ${S}</span><span>${poly([[q(na * (100 - ra), 100), X], [q(nb * (100 - rb), 100), Y]])} = ${T}</span></span>` },
    { q: `${it[0]}と${it[1]}の1個の定価をそれぞれ求めなさい。`, a: `${it[0]} ${x} 円，${it[1]} ${y} 円` },

SO.douten2 = () => {
  const a = pick([6, 8, 10, 12]); const x0 = R(1, a / 2 - 1); const S = x0 * (a - x0); const x1 = R(1, a / 2);

  const sv = new Svg(230, a * u + 45); sv.poly([A, B, C, D]).poly([P, B, Qp], { fill: 'var(--shade)' }).poly([A, B, C, D]).dot(P[0], P[1]).dot(Qp[0], Qp[1]); sv.text(A[0] - 10, A[1] - 4, 'A').text(B[0] - 10, B[1] + 8, 'B').text(C[0] + 10, C[1] + 8, 'C').text(D[0] + 10, D[1] - 4, 'D').text(P[0] - 11, P[1], 'P').text(Qp[0], Qp[1] + 13, 'Q');

Object.assign(SO_LABEL, { teika: '連立方程式の利用（定価と割引）', douten2: '2次方程式の利用（2つの動点）' });

// ===== 登録と画面 =====
function shomonGroup(keys, title) { return () => { const ks = []; while (ks.length < 8) ks.push(...shuffle(keys)); const items = ks.slice(0, 8).map(genItem).map(it => ({ q: /[。]$|<\/svg>$|<\/div>$/.test(it.q) ? it.q : it.q + ' を計算しなさい。', a: it.a, ex: it.ex, tag: SM_LABEL[it.key] })); return { title, lead: `次の(1)〜(8)の問いに答えなさい。`, items }; }; }
const FIELDS = {
  shomon: { name: '小問集合', note: '計算・方程式・関数・データ・図形を1題に', pats: {
    mix: ['おまかせ（入試の第1問形式）', genShomon], calc: ['計算だけ', shomonGroup(SM_CALC, '小問集合（計算）')], hou: ['方程式・因数分解', shomonGroup(SM_OTHER.hou, '小問集合（方程式）')],
    kan: ['関数の小問', shomonGroup(SM_OTHER.kan, '小問集合（関数）')], kazu: ['数と式（平方根・不等式など）', shomonGroup(SM_OTHER.kazu, '小問集合（数と式）')], data: ['データ・確率の小問', shomonGroup(SM_OTHER.data, '小問集合（データ・確率）')], zu: ['図形の小問', shomonGroup(SM_OTHER.zu, '小問集合（図形）')] } },

  zukei: { name: '平面・空間図形', note: '相似の証明・面積比・立体', pats: Object.fromEntries(Object.keys(ZU).map(k => [k, [ZU_LABEL[k], ZU[k]]])) },
  kakuritsu: { name: '確率・データ', note: 'カード・玉・さいころ・箱ひげ図', pats: Object.fromEntries(Object.keys(KP).map(k => [k, [KP_LABEL[k], KP[k]]])) },

function generate(field, pat) {
  const F = FIELDS[field]; const key = pat === 'any' ? pick(Object.keys(F.pats)) : pat;

if (typeof module !== 'undefined') module.exports = { FIELDS, generate, SM, genItem, SM_LABEL };

// ---- 画面 ----
if (typeof document !== 'undefined') (function () {
